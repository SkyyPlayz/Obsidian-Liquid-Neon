name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint CSS
        run: npm run lint:css

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin dependencies
        working-directory: plugin/Liquid-Neon-Companion
        run: npm install --no-audit --no-fund

      - name: Typecheck plugin
        working-directory: plugin/Liquid-Neon-Companion
        run: npx tsc --noEmit --skipLibCheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin dependencies
        working-directory: plugin/Liquid-Neon-Companion
        run: npm install --no-audit --no-fund

      - name: Run property-based tests (Vitest + fast-check)
        working-directory: plugin/Liquid-Neon-Companion
        run: npm test

  fuzz:
    # 60-second fuzz run on ubuntu-latest (NOT self-hosted — see SKY-373 memory note).
    # Jazzer.js uses libFuzzer under the hood; ubuntu-latest runners have the required
    # clang/LLVM toolchain available via LLVM apt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LLVM / libFuzzer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Install plugin dependencies
        working-directory: plugin/Liquid-Neon-Companion
        run: npm install --no-audit --no-fund

      - name: Run Jazzer.js fuzz harness (60 s)
        working-directory: plugin/Liquid-Neon-Companion
        # jazzer CLI: first positional arg = harness module, --fuzz_time = wall-clock cap (seconds).
        # Seed corpus is provided so the fuzzer starts from known-interesting inputs
        # rather than random bytes, maximising coverage in 60 s.
        run: |
          npx jazzer src/fuzz/image-bytes-fuzz.ts \
            --fuzz_time=60 \
            src/fuzz/corpus/ \
            -- -max_total_time=60
        timeout-minutes: 3

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: plugin/Liquid-Neon-Companion/crash-*

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build self-contained theme.css
        run: node scripts/build-theme.js

      - name: Verify both theme.css paths are in sync
        run: |
          if ! diff -q theme/Liquid-Neon/theme.css theme.css > /dev/null; then
            echo "ERROR: theme/Liquid-Neon/theme.css and theme.css differ — run 'npm run build:theme' and commit both."
            exit 1
          fi
          echo "theme.css sync check passed ✓"

      - name: Verify all --ln-* tokens are defined
        run: |
          MISSING=$(node -e "
            const fs = require('fs');
            const css = fs.readFileSync('theme.css', 'utf8');
            const used = new Set((css.match(/var\(--ln-[\w-]+/g) || []).map(m => m.slice(4)));
            const defined = new Set((css.match(/^\s+--ln-[\w-]+(?=\s*:)/gm) || []).map(m => m.trim()));
            const missing = [...used].filter(t => !defined.has(t) && !t.endsWith('-'));
            if (missing.length) { console.log(missing.join('\n')); process.exit(1); }
          ")
          if [ $? -ne 0 ]; then
            echo "ERROR: undefined --ln-* tokens in theme.css:"
            echo "$MISSING"
            exit 1
          fi
          echo "Token completeness check passed ✓"
